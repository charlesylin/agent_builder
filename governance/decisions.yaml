    confirmation: 'After both amendments and the ratio recommendation were presented, the author said: "yes, build away".'
    decision: >-
      Amend v0.5.0 Build to remove four completed-test evidence and instruction
      files from the active tree while preserving Git-history retrieval,
      repair their references, and compact the current machine handoff without
      changing its top-level contract or the authoritative decision ledger.
    rationale: >-
      The four files total 2,702 lines; the two raw transcripts are already
      interpreted in docs/v0-2-skill-test.md, and the two handoff packets are
      unreferenced in the current tree. The 314-line machine handoff repeats
      38 decision summaries that remain in governance/decisions.yaml. This
      targets the agreed v0.5.0 problem of oversized repositories directly;
      the separate Python function refactors are not needed to make the tree
      smaller and are left for a later code-maintenance change.
    provenance: plan_recommendation_after_author_requested_cleanup
    record: f1e7582362e2c65c748cefa7691f7c236b9af42f:planning/v0-5-implementation-plan.md
  - id: AB-D075
    status: confirmed
    date: 2026-10-08
    confirmed_date: 2026-10-08
    confirmed_by: charles-yang-lin
    confirmation: 'After the ratio-as-signal recommendation was presented, the author said: "yes, build away".'
    decision: >-
      Add a v0.5.0 test-design rule: define expected behavior during Plan, keep
      one-off feasibility probes uncommitted, and commit focused unit and
      compatibility tests only for continuing guarantees. Audit generated
      scaffold tests and CI for redundant checks. Treat more test lines than
      first-party code as a review signal, not an absolute cap.
    rationale: >-
      The author reports too many performative checks and asks for planned unit
      tests, transient planning checks, and committed dependency/environment
      tests. This repository has 1,475 first-party Python test lines versus
      1,947 Python source lines, but newly seeded projects can have no
      product code at all. A hard ratio gate could encourage deleting valuable
      edge-case tests or inflating implementation code; a purpose-based audit
      targets the reported waste without weakening supported guarantees. This
      narrows AB-D022 for an empty neutral project: no CI job is seeded before
      there is behavior or a compatibility contract to protect. Agent and skill
      scaffolds retain CI for their continuing contracts.
    amends: AB-D022
    provenance: author_requested_plan_addition_with_ratio_recommendation
    record: f1e7582362e2c65c748cefa7691f7c236b9af42f:planning/v0-5-implementation-plan.md
