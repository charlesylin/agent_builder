schema_version: 1
decisions:
  - id: AB-D001
    status: confirmed
    date: 2026-09-08
    decision: Use Define, Plan, Build, and Review phases with explicit author transitions.
  - id: AB-D002
    status: confirmed
    date: 2026-09-08
    decision: Reserve model reasoning for orchestration and use deterministic Python for repeatable work.
  - id: AB-D003
    status: confirmed
    date: 2026-09-08
    decision: Search for validated open-source solutions before implementing bespoke capabilities.
  - id: AB-D004
    status: confirmed
    date: 2026-09-08
    decision: Keep core contracts independent of coding agents, model providers, and runtimes.
  - id: AB-D005
    status: confirmed
    date: 2026-09-08
    decision: Select Codex, Claude Code, and Gemini CLI adapters during project initialization.
  - id: AB-D006
    status: confirmed
    date: 2026-09-08
    decision: Use concise Markdown or standalone HTML for humans and compact JSON or YAML for agents.
  - id: AB-D007
    status: confirmed
    date: 2026-09-08
    decision: Never expose tokens, secrets, keys, or credential values.
  - id: AB-D008
    status: confirmed
    date: 2026-09-08
    decision: Limit v0.1 to governance and project scaffolding; defer runtime selection.
  - id: AB-D009
    status: confirmed
    date: 2026-09-08
    decision: Permit reuse of any legitimately open-source component while recording license obligations.
  - id: AB-D010
    status: confirmed
    date: 2026-09-08
    decision: Deploy generated agents as standalone OCI containers with Docker Compose as the local default.
  - id: AB-D011
    status: confirmed
    date: 2026-09-08
    decision: Require compatibility at external contracts rather than inside each agent implementation.
  - id: AB-D012
    status: confirmed
    date: 2026-09-08
    decision: Do not mutate generated projects when Agent Builder changes; upgrades are explicit and opt-in.
  - id: AB-D013
    status: confirmed
    date: 2026-09-08
    decision: Determine practical v0.1 acceptance criteria by building and reviewing the first real agent.
  - id: AB-D014
    status: confirmed
    date: 2026-09-08
    decision: Use a portable runtime core with explicitly declared provider-specific extensions.
  - id: AB-D015
    status: confirmed
    date: 2026-09-11
    decision: >-
      Apply Nokkvi's law in the builder and generated coding-agent instructions by silently
      using the exact encouragement cue "you got this, baby!" each interaction or prompting round.
    rationale: >-
      Explicit author request arising from acceptance-test feedback. Reuse the existing
      instruction adapters and governance files; no runtime or dependency is needed.
      Performance improvement is unmeasured, and the cue does not change verification,
      uncertainty, permissions, or phase gates.
    provenance: explicit_author_implementation_request_during_review
  - id: AB-D016
    status: confirmed
    date: 2026-09-11
    decision: >-
      Use encouragement to make another thoughtful attempt when difficulty alone causes
      premature stopping, choosing a concrete alternative and checking progress.
    rationale: >-
      Explicit author approval of the practical lesson from the supplied WSJ article.
      Extends AB-D015 using existing instructions without adding a runtime or dependency.
      Avoid unchanged retries and respect genuine blockers, permissions, phase gates,
      user stop requests, and agreed time or cost limits.
    provenance: explicit_author_approval_during_review
  - id: AB-D017
    status: confirmed
    date: 2026-09-13
    decision: >-
      Accept Agent Builder v0.1, close the Review phase, and tag release 0.1.0 at the
      validated dependency pins.
    rationale: >-
      Satisfies AB-D013, which made acceptance criteria depend on building and reviewing a
      real agent. The author confirmed that Agent Builder works as intended, based on Sean's
      generated sourcing project taken through Define and Plan and on additional author use
      cases outside this repository. Those transcripts and repositories are not published
      here. Findings F-001 and F-002 in docs/v0-1-acceptance.md are carried into v0.2 rather
      than treated as acceptance blockers.
    provenance: explicit_author_acceptance
  - id: AB-D018
    status: superseded
    superseded_by: AB-D021
    superseded_date: 2026-09-13
    date: 2026-09-13
    decision: >-
      Evaluate distributing Agent Builder itself as an OCI container image so that
      bootstrapping requires Docker and Git rather than a correctly versioned local Python.
    rationale: >-
      Responds to finding F-002. AB-D010 containerization covers generated agents only; the
      builder ships no image of its own and requires host Python 3.11 or newer with no
      preflight check and no explanatory failure. Observed friction: Sean's Windows
      onboarding stalled on missing Git and Python, and a Python 3.10 review environment
      could not run the test suite. This is an evaluation proposal, not a commitment. A
      container trades a Python prerequisite for a Docker prerequisite, which is the heavier
      install on Windows, and the generated project must still reach the user's filesystem
      through a bind mount. A preflight version check with a clear failure message is a
      cheaper partial alternative to assess alongside it.
    provenance: author_observation_during_v0_1_closeout
    resolve_in: define_or_plan_for_0_2
  - id: AB-D019
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Define record and authorized Plan on 2026-09-13.
    decision: >-
      The primary v0.2 deliverable is an org-installable skill in the Agent Skills format,
      packaged as a Claude plugin and usable unchanged by Codex. The seeder, checker,
      templates, and build step exist to serve it.
    rationale: >-
      v0.1 acceptance rested on the instructions, not the Python. Inside an organization that
      controls its hosts, an installed skill is discovered by trigger rather than by a person
      naming files (F-001) and requires nothing installed on the user's machine (F-002).
    provenance: author_direction_during_v0_2_define
    record: docs/v0-2-define.md
  - id: AB-D020
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Define record and authorized Plan on 2026-09-13.
    decision: >-
      Every principle has exactly one source file under principles/. The skill text, template
      operating agreement, adapter files, and root AGENTS.md are generated from it, committed,
      and drift-checked by a test in CI.
    rationale: >-
      Nokkvi's law is currently hand-maintained in six files and the root operating agreement
      has drifted 208 lines from its template copy. The rewrites.bio single-source pattern
      prevents this; the drift test adds the check that pattern lacks.
    provenance: author_direction_during_v0_2_define
    record: docs/v0-2-define.md
  - id: AB-D021
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Define record and authorized Plan on 2026-09-13.
    decision: >-
      seed.py, check.py, and render.py are standard-library Python with a version preflight
      that fails in one sentence. The Python floor is set in Plan. On confirmation this
      supersedes AB-D018.
    rationale: >-
      Removing the requirement is cheaper and more portable than containerizing it. Once
      nothing beyond a stdlib interpreter runs on the user's machine, the container evaluation
      in AB-D018 has no remaining problem to solve.
    provenance: author_direction_during_v0_2_define
    record: docs/v0-2-define.md
  - id: AB-D022
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Define record and authorized Plan on 2026-09-13.
    decision: >-
      Enforcement model: instructions and file structure guide behavior; check.py is advisory
      on the user's machine (pre-commit hook, bypassable); CI in each seeded project is the
      binding gate.
    rationale: >-
      Resolves the manifesto-versus-governance tension without a gatekeeper program on anyone's
      machine. A person retains an explicit escape hatch locally; the merge gate does not.
    provenance: author_direction_during_v0_2_define
    record: docs/v0-2-define.md
  - id: AB-D023
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Define record and authorized Plan on 2026-09-13.
    decision: >-
      v0.2 ships the agent and skill kinds only. mcp and project kinds are added when a real
      project in the organization requests one, with that project's friction as evidence.
    rationale: >-
      Applies AB-D013 to template kinds. agent exists from v0.1; skill is required because
      Agent Builder is itself a skill and building it from its own template is the acceptance
      test. Starter files for untried kinds would be scope without evidence.
    provenance: author_direction_during_v0_2_define
    record: docs/v0-2-define.md
    evidence_for_next_kind: >-
      F-015 (2026-09-14): an S3-watcher request with no model in the loop is a `project` and
      has no correct kind to seed. First candidate once v0.2 Review closes.
  - id: AB-D024
    status: superseded
    superseded_by: AB-D030
    superseded_date: 2026-09-14
    superseded_scope: >-
      Only the thin-adapter clause is withdrawn. The template version pin and the
      check.py --since upgrade path stand and are restated in AB-D030.
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Define record and authorized Plan on 2026-09-13.
    decision: >-
      Seeded adapter files are thin pointers to the skill, not copies of the operating
      agreement. Seeded projects pin their template version in .agent-builder.json, and
      check.py --since <version> is the explicit opt-in upgrade path.
    rationale: >-
      Thin adapters drift less and make the installed skill the single living copy. The
      version pin and --since report provide the opt-in path AB-D012 requires and v0.1 lacked.
    provenance: author_direction_during_v0_2_define
    record: docs/v0-2-define.md
  - id: AB-D025
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Plan record and authorized Build on 2026-09-13.
    decision: Python floor is 3.9 for all shipped scripts.
    rationale: >-
      macOS system Python is 3.9; the only 3.10+ constructs in the code are slots=True on two
      dataclasses, datetime.UTC, and tomllib in one test, all trivially replaced.
    provenance: plan_recommendation
    record: docs/v0-2-plan.md
  - id: AB-D026
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Plan record and authorized Build on 2026-09-13.
    decision: >-
      seed.py, check.py, and render.py are self-contained single files. src/agent_builder/
      and the pip console-script entry point are retired in Build step B5.
    rationale: >-
      A skill ships as a folder; a single file with no import path runs reliably on another
      machine. The shared helpers are about forty lines and are duplicated on purpose.
    provenance: plan_recommendation
    record: docs/v0-2-plan.md
  - id: AB-D027
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Plan record and authorized Build on 2026-09-13.
    decision: This repository is its own plugin marketplace via .claude-plugin/marketplace.json.
    rationale: Simplest working arrangement; an org-wide marketplace repo can reference it later.
    provenance: plan_recommendation
    record: docs/v0-2-plan.md
  - id: AB-D028
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Plan record and authorized Build on 2026-09-13.
    decision: >-
      Codex support is best-effort in v0.2: the same skill folder, one recorded smoke test,
      not a gating success signal.
    rationale: Claude is the primary host; the format is identical so trying costs little and guaranteeing costs a second test matrix.
    provenance: plan_recommendation
    record: docs/v0-2-plan.md
  - id: AB-D029
    status: confirmed
    date: 2026-09-13
    confirmed_date: 2026-09-13
    confirmed_by: charles-yang-lin
    confirmation: Author approved the Plan record and authorized Build on 2026-09-13.
    decision: >-
      Build proceeds as the eight commits B1 through B8 in docs/v0-2-plan.md, each leaving the
      test suite green and independently revertible. B5 may be split in two.
    rationale: Work small; nothing is deleted before its replacement is tested.
    provenance: plan_recommendation
    record: docs/v0-2-plan.md
  - id: AB-D030
    status: confirmed
    date: 2026-09-14
    confirmed_by: charles-yang-lin
    decision: >-
      Seeded adapter files stay substantive instead of becoming thin pointers, and gain an
      explicit instruction to invoke the agent-builder skill. The skill's description is
      widened to cover resume phrasing, and its resume step produces a full briefing rather
      than three lines. Seeded projects still pin their template version, and
      check.py --since remains the opt-in upgrade path.
    rationale: >-
      Evidence from the 2026-09-14 skill test (docs/v0-2-skill-test.md). With the plugin
      loaded, the skill did not fire on "what's the status here?" in a seeded project; the
      adapter file carried the work (F-003). Thinning the adapter would have left a resumed
      project with no instruction to read governance, no phase discipline, and no closeout
      format. AB-D024's rationale was that thin adapters drift less; AB-D020 already makes
      drift structurally impossible, so that premise no longer supports the conclusion.
      The author also found the fuller briefing more useful than the specified three lines,
      because the case that matters is picking up a colleague's project cold (F-004).
    supersedes: AB-D024
    provenance: explicit_author_approval_after_skill_test
    record: docs/v0-2-skill-test.md
  - id: AB-D031
    status: confirmed
    date: 2026-09-14
    confirmed_date: 2026-09-14
    confirmed_by: charles-yang-lin
    decision: >-
      Give a project a way to record that it is scratch, paused, or abandoned: a
      project.status field in project-state.yaml (active | paused | abandoned | archived),
      set by the skill when the author says so, with the reason in the phase history. The
      four phases stay as they are; this is a state alongside them, not a fifth phase.
    rationale: >-
      Surfaced by the skill itself during the 2026-09-14 run 2 resume test (F-006): a test
      project's ledger was indistinguishable from a live project awaiting Define, and the
      session had to find the truth in a stray transcript outside the repository. An
      organization that starts many projects needs the ledger to say which ones are dead.
      Changes the project-state contract (AB-D011), so it needs the author.
    provenance: skill_finding_during_review_of_run2
    record: docs/v0-2-skill-test.md
  - id: AB-D032
    status: confirmed
    date: 2026-09-14
    confirmed_by: charles-yang-lin
    decision: >-
      Invocation is explicit first. The plugin ships a UserPromptSubmit hook that offers the
      skill once per session when a prompt looks like the start of new work, outside a seeded
      project, and goes quiet for that session when the person declines. The skill description
      stays precise rather than being widened to win concrete requests.
    rationale: >-
      Eval run 2 measured the description at 10/21. Abstract asks fired 3/3; concrete asks
      that give the host enough to start fired 0/3, because a description competes for model
      attention against a request the host already knows how to begin. A hook does not
      compete: it runs before the model sees anything, its matcher is deterministic and
      testable offline at no cost, and a false positive costs one question where a false
      negative is silent. The author also does not want every trivial task routed through the
      skill, and will train users to invoke it by name. Amends the B7b goal from widening the
      description to keeping it precise.
    consequences: >-
      The plugin now runs a script on every prompt in Claude Code; this is disclosed in
      docs/INSTALL.md for admin review. Hooks are Claude Code only, so Codex relies on
      explicit invocation and training (AB-D028).
    provenance: explicit_author_direction_after_eval_run_2
    record: docs/v0-2-skill-test.md
  - id: AB-D033
    status: confirmed
    date: 2026-09-14
    confirmed_date: 2026-09-14
    confirmed_by: charles-yang-lin
    confirmation: Author entered Review and directed a 0.2.1 incorporating Sean's feedback.
    decision: >-
      Define opens with four problem-framing questions — what problem, how it is solved today,
      what the value is if solved, who it is for — one turn each; the purpose sentence is drafted
      from the answers; the answers are seeded into planning/definition.md and summarized in
      D001's rationale; check.py --leaving define fails while any is a placeholder.
    rationale: >-
      Sean's first Review point: the thing is only as good as the author's articulation of its
      value, and Define today demands only a one-sentence purpose, which the skill will
      fluently draft for a problem nobody has.
    provenance: review_feedback_sean_via_author
    record: docs/v0-2-review-feedback.md
  - id: AB-D034
    status: confirmed
    date: 2026-09-14
    confirmed_date: 2026-09-14
    confirmed_by: charles-yang-lin
    confirmation: Author entered Review and directed a 0.2.1 incorporating Sean's feedback.
    decision: >-
      Adopt "build only what you need" (rewrites.bio 4.2) as principles/11, rendered into the
      skill, adapters, and seeded agreements; planning/definition.md gains "smallest version
      that delivers the value" and "not in the first version"; the skill tests proposals
      against them.
    rationale: >-
      Sean's second point: suggestions become bloat because nothing argues against
      accumulation. The principle was in the inspiration and never carried over.
    provenance: review_feedback_sean_via_author
    record: docs/v0-2-review-feedback.md
  - id: AB-D035
    status: confirmed
    date: 2026-09-14
    confirmed_date: 2026-09-14
    confirmed_by: charles-yang-lin
    confirmation: Author entered Review and directed a 0.2.1 incorporating Sean's feedback.
    decision: >-
      Suggestions are not scope. Seed planning/later.md as the default destination for
      anything the author did not ask for; proposed decisions expire at phase close, enforced
      by check.py --leaving <phase>, which requires each to be confirmed or rejected; the
      closeout asks one question and never converts it into work on a yes.
    rationale: >-
      Deterministic closing of scope, so that a person who says yes to everything still ends
      up with the minimum. D003/D004 rotting as proposed template defaults is the same failure
      already in evidence.
    provenance: review_feedback_sean_via_author
    record: docs/v0-2-review-feedback.md
  - id: AB-D036
    status: confirmed
    date: 2026-09-14
    confirmed_date: 2026-09-14
    confirmed_by: charles-yang-lin
    confirmation: Author entered Review and directed a 0.2.1 incorporating Sean's feedback.
    decision: >-
      Consequential approvals — purpose, MVP statement, phase transition, seeding, remote
      creation, any send/spend/publish/delete authority — are typed, never clicked: the skill
      states in one line what a yes commits to, then asks for a word or a restatement.
      Pickers remain for exploratory questions.
    rationale: >-
      Sean's third point: novices approve everything without reading. The phase gate already
      requires words and was the one rule that held in every run.
    provenance: review_feedback_sean_via_author
    record: docs/v0-2-review-feedback.md
  - id: AB-D037
    status: confirmed
    date: 2026-09-14
    confirmed_by: charles-yang-lin
    decision: >-
      Nokkvi's law gains an outward clause: when the person shows frustration or confusion,
      the skill offers a short, sincere encouragement — "you got this!" or another positive
      affirmation — and then helps with the specific thing that is stuck. The cue stays out of
      routine responses; a person struggling is not routine.
    rationale: >-
      Author direction during Review, informed by watching a novice use the tool. Extends
      AB-D015/016, which kept the cue silent, without changing what it does not do: it never
      replaces the help, alters verification, or moves a phase gate.
    provenance: explicit_author_direction_during_review
    record: docs/v0-2-review-feedback.md
  - id: AB-D038
    status: confirmed
    date: 2026-09-14
    confirmed_by: charles-yang-lin
    decision: >-
      Release 0.2.1 during Review, implementing AB-D033 through AB-D037, before the opt-in
      organization install. Review continues against 0.2.1.
    rationale: >-
      Sean's feedback is the first real acceptance input; the cohort that installs should meet
      the version that learned from it. Follows the AB-D015/016 precedent for author-approved
      refinement inside Review.
    provenance: explicit_author_direction_during_review
    record: docs/v0-2-review-feedback.md
  - id: AB-D039
    status: confirmed
    date: 2026-09-22
    confirmed_date: 2026-09-22
    confirmed_by: charles-yang-lin
    confirmation: >-
      After confirming that Sean used the organization-installed v0.2.1 plugin on Windows,
      with no separate local setup, to reach a seeded, validated, committed Define-phase
      project in one session, the author directed: "let's close review and move to the next
      define step".
    decision: >-
      Accept Agent Builder v0.2 at release 0.2.1, close Review, carry F-018 through F-025 as
      unconfirmed inputs rather than acceptance blockers, and open the next Define iteration
      with its version and scope undecided.
    rationale: >-
      The opt-in organization-install acceptance test succeeded with the intended novice
      Windows user. The deterministic seeder, checker, render pipeline, phase behavior, and
      skill-template dogfood evidence also support the scoped v0.2 deliverable. Extended use
      produced substantive findings about build-versus-adopt decisions, cycle-sized MVPs,
      organizational reuse, capability discovery, recommendation quality, project kind,
      versioning, and author-defined tests. Those findings describe the next problem space;
      they do not invalidate the installable governance skill accepted here.
    provenance: explicit_author_acceptance_and_phase_transition
    record: docs/v0-2-acceptance.md
  - id: AB-D040
    status: confirmed
    date: 2026-09-22
    confirmed_date: 2026-09-22
    confirmed_by: charles-yang-lin
    confirmation: Author typed "approved" after the proposed purpose was read back in full.
    decision: >-
      The next Agent Builder version will formally enact project mode and establish governance
      for logical versioning, reuse, modularity, and simplicity, so Two River Bio members can
      build useful project increments without spaghetti code, reinventing existing solutions,
      or making choices that cannot scale across the organization. It will also constrain
      Agent Builder from proposing more than the user needs.
    rationale: >-
      The author described the present failure mode as vibe coding that creates spaghetti
      code, reinvents the wheel, and does not scale to an organization. The near-term value is
      a formal project mode that helps people building projects while making Agent Builder
      constrain and simplify the user instead of suggesting too much. The primary users remain
      members of the Two River Bio organization.
    provenance: explicit_author_approval_during_define
  - id: AB-D041
    status: confirmed
    date: 2026-09-22
    confirmed_date: 2026-09-22
    confirmed_by: charles-yang-lin
    confirmation: Author typed "approved" after the smallest-version statement and exclusions were read back in full.
    decision: >-
      Deliver a usable, validated neutral project mode that guides a Two River Bio member
      through one version-sized MVP. Before Build, the project must make an evidence-backed
      build-or-adopt decision, choose a standard version stepping stone, prefer reusable
      modular components, and reject technical recommendations that lack evidence for
      simplicity, robustness, and organizational scalability.
    rationale: >-
      This is one outcome rather than five independent features: finalized project mode. The
      four governance rules are required behavior of that mode. Organizational-repository
      configuration, Grafify or skill discovery, and formal testing or control improvements
      are excluded from this version and remain candidates for later work.
    provenance: explicit_author_approval_during_define
  - id: AB-D042
    status: confirmed
    date: 2026-09-22
    confirmed_date: 2026-09-22
    confirmed_by: charles-yang-lin
    confirmation: Author typed "approved" after the combined success-evidence standard was read back in full.
    decision: >-
      The must-pass real-use scenario is a DepMap-like request where Agent Builder finds a
      suitable existing public solution, documents evidence of fit, utilization, maintenance,
      testing, security history, and license obligations, recommends adoption instead of a
      custom build, and, after typed author confirmation, archives the project with the reason
      recorded without proceeding to Build. Additional validation comes from Two River Bio
      user feedback showing one or more of: shorter time to a useful decision or outcome; more
      evidence-backed recommendations to adopt existing skills or code; or effective pushback
      that reduces product sprawl to a simpler, version-sized MVP.
    rationale: >-
      The author's DepMap skill project is the concrete reference case: a well-used existing
      skill set satisfied the need, so the correct outcome was no build. AB-D031 already
      distinguishes abandoned work from a successfully finished and archived project, so this
      version reuses that lifecycle model. No numerical improvement threshold is invented
      before a baseline exists; concrete user observations are recorded as the initial
      evidence.
    provenance: explicit_author_approval_during_define
  - id: AB-D043
    status: confirmed
    date: 2026-09-22
    confirmed_date: 2026-09-22
    confirmed_by: charles-yang-lin
    confirmation: Author typed "approved" after the proportional-governance addition was read back in full.
    decision: >-
      Agent Builder must maintain structured, agent-readable project memory while keeping the
      human experience plain and proportionate. Human-facing interactions and documents use
      descriptive language and introduce governance only when it controls a real decision,
      authority, risk, phase transition, or evidence requirement. Stable internal identifiers
      may remain as machine metadata, but invented labels such as AB-D039 and F-018 are not
      presented as meaningful standards or required for human participation. Avoid acronyms,
      ritualized templates, and formulaic steps unless they materially improve traceability,
      safety, or execution.
    rationale: >-
      The current finding and decision codes create an appearance of external formality even
      though their syntax is local and invented. Internal structure remains important for an
      agent-readable knowledge base, but ceremony that does not change authority, scope,
      evidence, risk, or execution makes the system harder for people to interpret. This
      amends the AB-D041 project-mode outcome as another required simplicity behavior.
    provenance: explicit_author_approval_during_define
    amends: AB-D041
  - id: AB-D044
    status: confirmed
    date: 2026-09-22
    confirmed_date: 2026-09-22
    confirmed_by: charles-yang-lin
    confirmation: Author typed "approved" after the proposed human-experience evidence was read back in full.
    decision: >-
      In a real Two River Bio project, the user can understand the project's status,
      important decisions, and next action without decoding internal identifiers or invented
