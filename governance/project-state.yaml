next_release:
  target: 0.4.0
  version_status: candidate_not_opened
  version_scheme: semantic_versioning_2_0_0
  version_decision: AB-D047
  purpose_status: open
  scope_status: open
  success_evidence_status: open
  candidate_direction: >-
    Evaluate a maintained Spec Kit dependency and targeted replacements under the confirmed
    release split in AB-D047. Exact scope and success evidence require v0.4.0 Define.
  note: >-
    The author asked to use v0.3.0 before advancing to v0.4.0; no v0.4.0 phase has opened.
    A quick pre-seed existing-solution check was discussed during v0.3.0 Review but not
    adopted as a requirement; see docs/v0-3-acceptance.md.

checkpoint:
  date: 2026-09-24
  status: release_accepted_in_use
  phase_changed: false
  human_handoff: docs/RESUME.md
  machine_handoff: governance/handoff.json
  next_action: >-
    Push the release commit and v0.3.0 tag when the author chooses. Use v0.3.0 and record
    any real-use feedback. Enter v0.4.0 Define only on renewed explicit author direction.
