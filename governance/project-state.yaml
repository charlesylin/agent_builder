next_release:
  target: 0.2.0
  scope: org_installable_skill_with_seeder_templates_and_single_source_build
  scope_status: defined_pending_author_confirmation
  runtime_included: false
  define_record: docs/v0-2-define.md
  deliverables:
    - id: skill
      summary: skills/agent-builder/SKILL.md in Agent Skills format, packaged as a Claude plugin, usable by Codex.
    - id: seeder
      summary: skills/agent-builder/scripts/seed.py creates a project from templates/base plus one kind; check.py validates one.
    - id: templates
      summary: templates/base plus templates/kinds/agent and templates/kinds/skill, inside this repository.
    - id: build
      summary: build/render.py assembles generated files from principles/; a CI test fails on drift.
  kinds: [agent, skill]
  proposed_decisions: [AB-D019, AB-D020, AB-D021, AB-D022, AB-D023, AB-D024]
  inputs_resolved:
    - id: F-001
      resolution: Skill is discovered by trigger; seeded repos carry in-repo skill pointers.
    - id: F-002
      resolution: Stdlib-only scripts with version preflight (AB-D021); no Python beyond the interpreter on the user's machine.
    - id: AB-D018
      resolution: To be superseded by AB-D021 on confirmation.
  inputs_deferred:
    - id: AB-R001
      summary: Onboarding kit review. Not in v0.2 scope.
    - id: AB-R004
      summary: Existing-project adoption. Not in v0.2 scope; the project kind is the likely future home.
    - id: AB-D008
      summary: Runtime and environment profiles remain deferred.

