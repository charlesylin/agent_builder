next_release:
  target: null
  version_status: open_for_define
  scope: undetermined
  scope_status: open_for_define
  implementation_approved: false
  note: >-
    F-018 through F-025 are unprioritized inputs to Define, not confirmed scope or selected
    solutions. Define must identify one problem and one version-sized outcome before Plan.
  candidate_inputs:
    - id: F-018
      summary: Make public-solution discovery a build-or-adopt gate.
      source: docs/v0-2-review-feedback.md
    - id: F-019
      summary: Scope each cycle to one minimum viable outcome.
      source: docs/v0-2-review-feedback.md
    - id: F-020
      summary: Discover and reuse organizational code; make new code modular and reusable.
      source: docs/v0-2-review-feedback.md
    - id: F-021
      summary: Discover available and configured skills and capabilities before planning.
      source: docs/v0-2-review-feedback.md
    - id: F-022
      summary: Add the neutral project kind, now supported by real-use evidence.
      source: docs/v0-2-review-feedback.md
    - id: F-023
      summary: Apply an evidence-backed technical-quality gate to novice recommendations.
      source: docs/v0-2-review-feedback.md
    - id: F-024
      summary: Use explicit standard versions as useful, testable stepping stones.
      source: docs/v0-2-review-feedback.md
    - id: F-025
      summary: Have authors define expected results, examples, hypotheses, and controls.
      source: docs/v0-2-review-feedback.md

checkpoint:
  date: 2026-09-22
  status: define_opened_for_next_iteration
  phase_changed: true
  human_handoff: docs/RESUME.md
  machine_handoff: governance/handoff.json
  next_action: >-
    Ask the author what single problem the next iteration should solve. Establish the current
    approach, value, beneficiaries, version-sized outcome, exclusions, and success evidence.
    Do not select solutions or enter Plan without explicit author approval.
