release:
  target: 0.2.1
  scope: org_installable_skill_with_seeder_templates_and_single_source_build
  runtime_included: false
  acceptance_strategy: opt_in_org_install_then_collect_friction
  status: accepted
  accepted_date: 2026-09-22
  accepted_by: charles-yang-lin
  decision: AB-D039
  tag: v0.2.1
  acceptance_record: docs/v0-2-acceptance.md
  previous:
    target: 0.1.0
    status: accepted
    accepted_date: 2026-09-13
    decision: AB-D017
    tag: v0.1.0
    acceptance_record: docs/v0-1-acceptance.md

next_release:
  target: 0.3.0
  version_status: confirmed_for_define
  version_scheme: semantic_versioning_2_0_0
  version_decision: AB-D045
  definition_record: planning/definition.md
  plan_record: planning/implementation-plan.md
  plan_comparison: planning/spec-kit-comparison.md
  plan_status: confirmed
  plan_decision: AB-D047
  purpose: >-
    Formally enact project mode and establish governance for logical versioning, reuse,
    modularity, and simplicity, so Two River Bio members can build useful project increments
    without spaghetti code, reinventing existing solutions, or making choices that cannot
    scale across the organization, while constraining Agent Builder from proposing more than
    the user needs.
  purpose_status: confirmed
  purpose_decision: AB-D040
  scope: >-
    A usable, validated neutral project mode that governs one version-sized MVP through an
    evidence-backed build-or-adopt decision, standard version stepping stone, reusable modular
    components, and an evidence-backed quality gate for simplicity, robustness, and
    organizational scalability. It maintains structured agent-readable memory while keeping
    human-facing governance plain, descriptive, and proportional to real decisions, authority,
    risk, phase transitions, and evidence requirements.
  scope_status: confirmed
  scope_decision: AB-D041
  scope_amendment: AB-D043
  exclusions:
    - Organizational-repository configuration.
    - Grafify or skill discovery.
    - Formal testing or control improvements.
  success_evidence:
    must_pass: >-
      In a real DepMap-like request, Agent Builder documents evidence for a suitable public
      solution, recommends adoption instead of custom implementation, and, after typed author
      confirmation, archives the project with the reason recorded without entering Build.
    additional_user_feedback:
      - Shorter time to a useful decision or outcome.
      - More evidence-backed recommendations to adopt existing skills or code.
      - Effective pushback that reduces product sprawl to a simpler version-sized MVP.
    measurement_note: Record concrete user observations; do not invent a numerical threshold before a baseline exists.
    human_experience: >-
      In real use, a Two River Bio member understands status, important decisions, and the
      next action without decoding internal identifiers or invented terms. Each human-facing
      approval has a concrete consequence, unnecessary ceremony is absent, and user feedback
      confirms the process feels clear and appropriately lightweight.
    status: confirmed
    decision: AB-D042
    human_experience_decision: AB-D044
  implementation_approved: true
  implementation_decision: AB-D048
  review_status: in_progress
  review_decision: AB-D049
  note: >-
    The purpose is confirmed under AB-D040 and the smallest version-sized outcome under
    AB-D041, amended by AB-D043 to require proportional plain-language governance. Success
    evidence is confirmed under AB-D042 and AB-D044. AB-D045 confirms the v0.3.0 target and
    versioning rule. AB-D047 confirms the lean plan and release split; AB-D048 authorized
    Build of that plan; AB-D049 authorized Review. Release acceptance and tagging remain open.
  candidate_inputs:
    - id: F-018
      summary: Make public-solution discovery a build-or-adopt gate.
      source: docs/v0-2-review-feedback.md
    - id: F-019
      summary: Scope each cycle to one minimum viable outcome.
      source: docs/v0-2-review-feedback.md
    - id: F-020
      summary: Discover and reuse organizational code; make new code modular and reusable.
      source: docs/v0-2-review-feedback.md
    - id: F-021
      summary: Discover available and configured skills and capabilities before planning.
      source: docs/v0-2-review-feedback.md
    - id: F-022
      summary: Add the neutral project kind, now supported by real-use evidence.
      source: docs/v0-2-review-feedback.md
    - id: F-023
      summary: Apply an evidence-backed technical-quality gate to novice recommendations.
      source: docs/v0-2-review-feedback.md
    - id: F-024
      summary: Use explicit standard versions as useful, testable stepping stones.
      source: docs/v0-2-review-feedback.md
    - id: F-025
      summary: Have authors define expected results, examples, hypotheses, and controls.
      source: docs/v0-2-review-feedback.md

checkpoint:
  date: 2026-09-23
  status: review_opened
  phase_changed: true
  human_handoff: docs/RESUME.md
  machine_handoff: governance/handoff.json
  next_action: >-
    Exercise v0.3.0 with a real Two River Bio user: test an evidence-backed adopt-and-archive
    recommendation, technical-quality pushback, and plain project status. Record observations
    and obtain explicit release acceptance before updating metadata or tagging v0.3.0.
