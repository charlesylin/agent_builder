next_release:
  target: 0.4.0
  version_status: confirmed_for_build
  version_scheme: semantic_versioning_2_0_0
  version_decision: AB-D051
  definition_record: planning/v0-4-definition.md
  purpose_status: confirmed
  scope_status: confirmed
  success_evidence_status: confirmed_for_build
  candidate_direction: >-
    Use a maintained Spec Kit dependency for a targeted partial replacement of idea
    assessment and proportional augmentation of specification, clarification, checklist,
    plan, tasks, and analysis. Preserve Agent Builder's working governance and avoid
    separate member setup or duplicate records. Target Claude Code and Codex across agent,
    skill, and project builds; Plan tested feasibility and net benefit before Build.
  note: >-
    v0.4.0 Build is open under the approved implementation plan. A quick pre-seed
    existing-solution check was discussed during v0.3.0 Review but not adopted
    as a separate requirement; see
    docs/v0-3-acceptance.md. The author chose a pinned, release-time-generated Spec Kit
    dependency payload over a separate member CLI installation. A filtered v1.1.0 payload
    passed the live Claude Code and Codex artifact-producing handoff gate, plus
    clean-copy seeding and helper checks across the six host/kind combinations.
    Public-source verification and real-use benefit remain Review tests; see
    docs/v0-4-build-verification.md.

checkpoint:
