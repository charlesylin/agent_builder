next_release:
  target: 0.2.0
  scope: undetermined
  scope_status: open_for_define
  runtime_included: undetermined
  note: >-
    The following are unprioritized inputs to Define. None is confirmed scope, and none
    implies a solution. Define establishes purpose, users, boundaries, non-goals, authority,
    risks, and success signals before any of these is designed.
  candidate_inputs:
    - id: F-001
      summary: Unprompted instruction discovery, so resume does not depend on an author-supplied file list.
      source: docs/v0-1-acceptance.md
    - id: F-002
      summary: Host prerequisites for running Agent Builder itself. See AB-D018 (proposed).
      source: docs/v0-1-acceptance.md
    - id: AB-R001
      summary: Employee onboarding kit review, including authoring hosts and instruction enforcement.
      source: docs/onboarding-kit-review.md
    - id: AB-R004
      summary: Adoption into existing non-agent projects while preserving their phase and decisions.
      source: docs/existing-project-review.md
    - id: AB-D008
      summary: Runtime and environment profiles, deliberately deferred at v0.1.
      source: governance/decisions.yaml

checkpoint:
  date: 2026-09-13
  status: define_opened_for_v0_2
  phase_changed: true
  human_handoff: docs/RESUME.md
  machine_handoff: governance/handoff.json
  next_action: >-
    Establish v0.2 purpose, users, boundaries, non-goals, authority, risks, and success
    signals. Do not design or implement before Plan is explicitly approved.
  runtime_implementation_approved: false

review:
  current_step: closed
  closed_date: 2026-09-13
  author_feedback_received: true
  outcome: >-
    Author confirmed Agent Builder works as intended, based on Sean's generated sourcing
    project and additional use cases outside this repository. Supporting transcripts and
    repositories are not published here.
  feedback:
    - date: 2026-09-11
      decision: AB-D015
      scope: Author-approved instruction refinement during acceptance review.
      outcome: Nokkvi's law added to builder governance and generated coding-agent adapters.
    - date: 2026-09-11
      decision: AB-D016
      scope: Author-approved practical refinement of Nokkvi's law.
      outcome: Encourage a concrete alternative before stopping for difficulty alone, within existing limits.
    - date: 2026-09-13
      decision: AB-D017
      scope: Author acceptance of v0.1 based on Sean's test and other use cases.
      outcome: Review closed; two findings carried into v0.2 rather than treated as blockers.
  findings:
    - id: F-001
      summary: Cross-account resume succeeded but required an author-supplied prompt naming the files to read.
      record: docs/v0-1-acceptance.md
    - id: F-002
      summary: Builder requires host Python 3.11+ with no preflight check, container, or explanatory failure.
      record: docs/v0-1-acceptance.md

