# Agent Builder uses the same fast pre-commit manager as rewrites.bio.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "local"
hooks = [
  { id = "ruff-check", name = "ruff check", entry = "ruff check --fix", language = "system", types = ["python"] },
  { id = "ruff-format", name = "ruff format", entry = "ruff format", language = "system", types = ["python"] },
  { id = "unit-tests", name = "unit tests", entry = "python3 -m unittest discover -s tests", language = "system", pass_filenames = false },
]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-toml" },
]
