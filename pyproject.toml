# Agent Builder ships as a skill folder (skills/agent-builder), not as a Python package.
# This file keeps repository metadata and the Ruff configuration only.

[project]
name = "agent-builder"
version = "0.3.0"
description = "Governance-first starting point for agents, skills, and projects"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Charles Yang Lin" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "prek==0.4.11",
  "ruff==0.16.6",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
